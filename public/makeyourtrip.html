<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travels Agent - Make Your Trip</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .heroo {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .heroo h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            color: #ffffff;
            margin: 0 0 24px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            max-width: 650px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .search-box input {
            flex: 1;
            height: 52px;
            padding: 12px 24px;
            border: 2px solid #ffffff;
            border-radius: 30px;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #f4b680;
            box-shadow: 0 0 0 4px rgba(244, 182, 128, 0.3);
        }

        .search-box button {
            height: 52px;
            padding: 0 28px;
            border: none;
            border-radius: 30px;
            background: #2c3e50;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .search-box button:hover {
            background-color: #1a252f;
            transform: translateY(-2px);
        }

        .nav2 {
            margin: 30px auto;
            display: flex;
            justify-content: center;
        }

        .nav2 ul {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 6px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .nav2 ul li a {
            display: block;
            color: #2c3e50;
            padding: 10px 24px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.25s ease;
        }

        .nav2 ul li a:hover,
        .nav2 ul li a.active {
            background-color: #2c3e50;
            color: #ffffff;
        }

        .heroo1 {
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 48px;
            gap: 40px;
            max-width: 1100px;
            margin: 40px auto 60px;
            border-radius: 28px;
            box-shadow: 0 16px 36px rgba(16, 185, 129, 0.3);
        }

        .heroo1-img {
            flex: 1;
            max-width: 480px;
        }

        .heroo1-img img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .heroo1-matter {
            flex: 1;
            color: #ffffff;
            text-align: left;
        }

        .heroo1-matter h2 {
            font-size: clamp(2rem, 3.5vw, 3rem);
            font-weight: 800;
            margin: 0 0 16px;
            line-height: 1.15;
        }

        .heroo1-matter p {
            font-size: 1.2rem;
            margin: 0 0 28px;
            opacity: 0.95;
        }

        .heroo1-matter .btn {
            display: inline-block;
            background-color: #111827;
            color: white;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .heroo1-matter .btn:hover {
            background-color: #000000;
            transform: translateY(-2px);
        }

        @media (max-width: 860px) {
            .heroo1 {
                flex-direction: column;
                margin: 30px 20px;
                padding: 32px 24px;
                text-align: center;
            }

            .heroo1-matter {
                text-align: center;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input, .search-box button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="makeyourtrip.html" class="active">Make Your Trip</a></li>
            <li><a href="populardestinations.html">Popular Destinations</a></li>
            <li><a href="expence.html">Budget Planner</a></li>
        </ul>
    </nav>

    <div class="heroo">
        <h1>Where To?</h1>
        <form class="search-box" id="searchTripForm" onsubmit="handleSearch(event)">
            <input type="search" id="tripSearchInput" placeholder="Search destinations (e.g. Dubai, Goa, Singapore)..." required>
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="nav2">
        <ul>
            <li><a href="hotel.html">Hotels</a></li>
            <li><a href="restraunts.html">Restaurants</a></li>
        </ul>
    </div>

    <div class="heroo1">
        <div class="heroo1-img">
            <img src="herooo11.avif" alt="Travel experiences">
        </div>
        <div class="heroo1-matter">
            <h2>Find things to do for everything you're into</h2>
            <p>Browse 400,000+ experiences and plan your trip with our live budget calculator.</p>
            <a href="populardestinations.html" class="btn">Explore Destinations</a>
        </div>
    </div>

    <script>
        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('tripSearchInput').value.trim();
            if (query) {
                window.location.href = `expence.html?to=${encodeURIComponent(query)}`;
            }
        }
    </script>
</body>
</html>
