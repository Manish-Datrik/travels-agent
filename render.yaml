services:
  - type: web
    name: travels-agent-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERPAPI_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://manish-datrik.github.io,http://localhost:6003,http://127.0.0.1:6003
